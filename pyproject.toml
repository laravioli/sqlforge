[project]
name = "sqlforge"
version = "0.1.0"
description = "A sql first python library"
readme = "README.md"
authors = [{ name = "Victor Le Couteur" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["sqlglot[c]>=30.14.0", "asyncpg>=0.31.0", "msgspec>=0.21.1"]

[project.urls]
Repository = "https://github.com/laravioli/sqlforge"
Issues = "https://github.com/laravioli/sqlforge/issues"

[project.scripts]
sqlforge = "sqlforge:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]
coverage = ["coverage[toml]>=7.15.2"]
pyright = ["asyncpg-stubs>=0.31.3", "pyright>=1.1.411"]

[tool.ruff]
line-length = 100

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest]
testpaths = ['tests']

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sqlforge"]
